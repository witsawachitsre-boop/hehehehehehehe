<html lang="th">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: "Kanit", sans-serif;
            background: #f4f8fb;
            color: #243447;
        }

        /* ================= NAVBAR ================= */

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid #e3edf4;
        }

        .nav-container {
            max-width: 1100px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 25px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #20a4f3;
        }

        .logo span {
            color: #243447;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #526579;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #20a4f3;
        }

        /* ================= HERO ================= */

        .hero {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 100px 25px 60px;

            background:
                radial-gradient(circle at 10% 20%, #dff5ff 0, transparent 30%),
                radial-gradient(circle at 90% 80%, #e5f7ff 0, transparent 30%),
                #f4f8fb;
        }

        .hero-container {
            max-width: 1100px;
            width: 100%;

            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 60px;

            align-items: center;
        }

        .hero-text h1 {
            font-size: clamp(42px, 6vw, 72px);
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .hero-text h1 span {
            color: #20a4f3;
        }

        .hero-text h2 {
            font-size: 25px;
            font-weight: 400;
            color: #526579;
            margin-bottom: 20px;
        }

        .hero-text p {
            font-size: 18px;
            line-height: 1.8;
            color: #66788a;
            max-width: 650px;
        }

        .buttons {
            margin-top: 30px;

            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;

            text-decoration: none;
            font-weight: 500;

            transition: 0.3s;
        }

        .btn-primary {
            background: #20a4f3;
            color: white;
            box-shadow: 0 8px 25px rgba(32, 164, 243, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            background: #168fd7;
        }

        .btn-secondary {
            border: 1px solid #cbdbe7;
            color: #526579;
            background: white;
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            border-color: #20a4f3;
            color: #20a4f3;
        }

        /* ================= PROFILE ================= */

        .profile-card {
            background: rgba(255,255,255,0.8);

            border: 1px solid #e0ebf2;
            border-radius: 25px;

            padding: 30px;

            text-align: center;

            box-shadow: 0 20px 50px rgba(50, 100, 130, 0.08);

            transition: 0.4s;
        }

        .profile-card:hover {
            transform: translateY(-8px);
        }

        .profile-image {
            width: 230px;
            height: 230px;

            margin: auto;
            margin-bottom: 20px;

            border-radius: 50%;

            object-fit: cover;

            border: 6px solid white;

            box-shadow:
                0 0 0 5px #dff3ff,
                0 15px 40px rgba(32, 164, 243, 0.15);
        }

        .profile-card h3 {
            font-size: 25px;
        }

        .profile-card p {
            color: #718394;
        }

        /* ================= SECTIONS ================= */

        section {
            padding: 100px 25px;
        }

        .section-container {
            max-width: 1100px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-title h2 {
            font-size: 38px;
        }

        .section-title p {
            color: #7b8c9c;
            margin-top: 8px;
        }

        /* ================= ABOUT ================= */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .info-card {
            background: white;

            padding: 30px;

            border-radius: 20px;

            border: 1px solid #e3edf4;

            transition: 0.3s;
        }

        .info-card:hover {
            transform: translateY(-5px);

            border-color: #bce5fa;

            box-shadow: 0 15px 35px rgba(50,100,130,0.08);
        }

        .info-card h3 {
            color: #20a4f3;
            margin-bottom: 12px;
            font-size: 23px;
        }

        .info-card p {
            color: #65788a;
            line-height: 1.8;
        }

        /* ================= SKILLS ================= */

        .skills {
            background: #edf7fc;
        }
